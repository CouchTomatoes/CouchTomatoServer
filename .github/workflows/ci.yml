name: CI

# The PR gate. The checks themselves live in _verify.yml so every caller holds a
# commit to the same standard.
#
# Releases and installers are built separately by release.yml on hosted runners.
#
# Branches (SickGear practice): PRs merge into `dev`, which never goes live.
# Merging `dev` into `main` is a deliberate, numbered release - release.yml cuts
# the tag, and the Pi4's updater pulls `main`. See docs/release-pipeline.md.

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    uses: ./.github/workflows/_verify.yml
