name: One-off NSIS install check
on:
  push:
    branches: [hotfix/windows-installer]
jobs:
  nsis:
    runs-on: windows-latest
    steps:
      - name: Install NSIS
        run: |
          $paths = @("${env:ProgramFiles(x86)}\NSIS\makensis.exe", "$env:ProgramFiles\NSIS\makensis.exe")
          $mk = $paths | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $mk) { choco install -y nsis }
          $mk = $paths | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $mk) {
            # Chocolatey's feed was unreachable from the runners too, so take NSIS's
            # own portable zip from SourceForge (its official download host).
            $zip = "$env:RUNNER_TEMP\nsis.zip"
            Invoke-WebRequest -Uri "https://downloads.sourceforge.net/project/nsis/NSIS%203/3.10/nsis-3.10.zip" `
              -OutFile $zip -UserAgent "Wget" -MaximumRetryCount 3 -RetryIntervalSec 5
            Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP\nsis" -Force
            $paths += "$env:RUNNER_TEMP\nsis\nsis-3.10\makensis.exe"
          }
          $mk = $paths | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $mk) { Write-Error "makensis.exe not found after installing NSIS"; exit 1 }
          "MAKENSIS=$mk" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: makensis answers
        run: '& "$env:MAKENSIS" /VERSION'
